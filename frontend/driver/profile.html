<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0a0a0f">
<title>PandaSkaters – Perfil Conductor</title>
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
.profile-hero {
  background: linear-gradient(160deg, #0d1a00, #0a0a0f);
  padding: calc(var(--header-h) + 1.5rem) 1.25rem 2rem;
  text-align: center;
  position: relative;
}
.profile-hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 50% 80%, rgba(198,241,53,.1), transparent 70%);
}
.vehicle-card {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 1rem;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
}
.vehicle-icon { font-size: 2rem; }
.status-indicator {
  display: inline-flex;
  align-items: center;
  gap: .4rem;
  padding: .35rem .8rem;
  border-radius: var(--radius-full);
  font-size: .75rem;
  font-weight: 600;
}
.status-pending  { background: rgba(245,158,11,.1); color: var(--warning); }
.status-approved { background: rgba(34,197,94,.1);  color: var(--success); }
.status-rejected { background: rgba(239,68,68,.1);  color: var(--danger); }
</style>
</head>
<body>
<div class="app-shell">
  <header class="app-header">
    <div class="header-logo">Panda<span>Skaters</span></div>
    <button class="btn btn-icon"><i class="fa fa-pen"></i></button>
  </header>

  <div class="profile-hero">
    <div class="avatar avatar-xl" style="margin:0 auto 1rem;position:relative">
      <i class="fa fa-user" style="font-size:2.5rem"></i>
    </div>
    <div style="font-size:1.4rem;font-weight:800;margin-bottom:.2rem" id="driverName">–</div>
    <div style="color:var(--text-muted);font-size:.82rem;margin-bottom:.75rem" id="driverEmail">–</div>
    <div id="driverStatusBadge" class="status-indicator status-pending">
      <i class="fa fa-clock"></i> Pendiente de aprobación
    </div>
    <div style="display:flex;justify-content:center;gap:2rem;margin-top:1.25rem;position:relative">
      <div style="text-align:center">
        <div style="font-size:1.3rem;font-weight:800;color:var(--accent)" id="statTotal">0</div>
        <div style="font-size:.65rem;color:var(--text-muted)">Viajes</div>
      </div>
      <div style="text-align:center">
        <div style="font-size:1.3rem;font-weight:800;color:var(--accent)" id="statRating">5.0</div>
        <div style="font-size:.65rem;color:var(--text-muted)">Rating</div>
      </div>
      <div style="text-align:center">
        <div style="font-size:1.3rem;font-weight:800;color:var(--accent)" id="statEarnings">$0</div>
        <div style="font-size:.65rem;color:var(--text-muted)">Ganancias</div>
      </div>
    </div>
  </div>

  <div class="page" style="padding-top:0">
    <div class="page-content" style="padding-top:1rem">

      <!-- Vehicle Card -->
      <h4 style="margin-bottom:.75rem">Mi Vehículo</h4>
      <div class="card vehicle-card" style="margin-bottom:1rem">
        <div class="vehicle-icon" id="vehicleIcon">🚗</div>
        <div style="flex:1">
          <div style="font-weight:700" id="vehicleName">–</div>
          <div style="font-size:.75rem;color:var(--text-muted)" id="vehiclePlate">–</div>
          <div style="font-size:.7rem;color:var(--accent);margin-top:.2rem" id="vehicleType">–</div>
        </div>
        <button class="btn btn-ghost btn-sm"><i class="fa fa-pen"></i></button>
      </div>

      <!-- Account menu -->
      <div class="card" style="padding:0;overflow:hidden;margin-bottom:1rem">
        <a class="menu-item" href="#">
          <div class="menu-icon"><i class="fa fa-id-card"></i></div>
          <span class="menu-label">Documentos</span>
          <i class="fa fa-chevron-right menu-chevron"></i>
        </a>
        <hr class="divider" style="margin:.25rem 1rem">
        <a class="menu-item" href="#">
          <div class="menu-icon"><i class="fa fa-bell"></i></div>
          <span class="menu-label">Notificaciones</span>
          <i class="fa fa-chevron-right menu-chevron"></i>
        </a>
        <hr class="divider" style="margin:.25rem 1rem">
        <a class="menu-item" href="#">
          <div class="menu-icon"><i class="fa fa-headset"></i></div>
          <span class="menu-label">Soporte</span>
          <i class="fa fa-chevron-right menu-chevron"></i>
        </a>
      </div>

      <div class="card danger-zone" style="padding:0;overflow:hidden">
        <a class="menu-item" onclick="logout()" href="#">
          <div class="menu-icon"><i class="fa fa-right-from-bracket"></i></div>
          <span class="menu-label">Cerrar Sesión</span>
          <i class="fa fa-chevron-right menu-chevron"></i>
        </a>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a class="nav-item" href="home.html"><i class="fa fa-house"></i><span>Inicio</span></a>
    <a class="nav-item" href="earnings.html"><i class="fa fa-wallet"></i><span>Ganancias</span></a>
    <a class="nav-item active" href="profile.html"><i class="fa fa-user-circle"></i><span>Perfil</span></a>
  </nav>
</div>
<div class="toast-container" id="toastContainer"></div>
<script src="../js/api.js"></script>
<script>
const user = JSON.parse(localStorage.getItem('ps_user')||'null');
const driver = JSON.parse(localStorage.getItem('ps_driver')||'null');
if (!user) location.href = '../index.html';

document.getElementById('driverName').textContent = user?.name || '–';
document.getElementById('driverEmail').textContent = user?.email || '–';
document.getElementById('statTotal').textContent = driver?.total_rides || 0;
document.getElementById('statRating').textContent = (driver?.rating||5).toFixed(1);
document.getElementById('statEarnings').textContent = `$${(driver?.total_earnings||0).toFixed(0)}`;

const icons = {economy:'🚗', premium:'🚙', moto:'🏍️'};
const typeLabels = {economy:'Económico', premium:'Premium', moto:'MotoTaxi'};
if (driver?.vehicle) {
  document.getElementById('vehicleName').textContent = `${driver.vehicle.brand} ${driver.vehicle.model} ${driver.vehicle.year}`;
  document.getElementById('vehiclePlate').textContent = driver.vehicle.plate;
  document.getElementById('vehicleType').textContent = typeLabels[driver.vehicle.vehicle_type] || '';
  document.getElementById('vehicleIcon').textContent = icons[driver.vehicle.vehicle_type] || '🚗';
}

const statusMap = {
  pending:  {cls:'status-pending',  icon:'fa-clock',   label:'Pendiente de aprobación'},
  approved: {cls:'status-approved', icon:'fa-check',   label:'Aprobado'},
  rejected: {cls:'status-rejected', icon:'fa-xmark',   label:'Rechazado'},
};
const st = statusMap[driver?.status || 'pending'];
if (st) {
  const el = document.getElementById('driverStatusBadge');
  el.className = `status-indicator ${st.cls}`;
  el.innerHTML = `<i class="fa ${st.icon}"></i> ${st.label}`;
}

function logout() {
  if (confirm('¿Cerrar sesión?')) { localStorage.clear(); location.href = '../index.html'; }
}
</script>
</body>
</html>
